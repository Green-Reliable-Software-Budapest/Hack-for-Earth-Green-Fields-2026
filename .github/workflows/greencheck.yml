name: GreenCheck tests

on:
  push:
    paths:
      - "examples/greencheck/**"
      - ".github/workflows/greencheck.yml"
  pull_request:
    paths:
      - "examples/greencheck/**"
      - ".github/workflows/greencheck.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run GreenCheck tests
        run: python -m unittest discover -s examples/greencheck/tests -v
